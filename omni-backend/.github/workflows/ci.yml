name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: omni
          POSTGRES_PASSWORD: omni
          POSTGRES_DB: omni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://omni:omni@localhost:5432/omni_test?schema=public
      DIRECT_URL: postgresql://omni:omni@localhost:5432/omni_test?schema=public
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      JWT_ACCESS_SECRET: ci-only-access-secret-not-a-real-secret-value
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-a-real-secret-value

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm prisma:migrate:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
